<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>{% block title %}Sistema de Ventas Web{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='bootstrap/bootstrap.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='css/estilos.css') }}">
</head>
<body>
{% if usuario %}
<nav class="navbar navbar-expand-lg navbar-light bg-info">
    <a class="navbar-brand text-white" href="/principal">Home</a>
    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav"
            aria-controls="navbarNav" aria-expanded="false" aria-label="Abrir navegación">
        <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav mr-auto">
            <li class="nav-item"><a class="btn btn-outline-light mx-1" href="/productos">Producto</a></li>
            <li class="nav-item"><a class="btn btn-outline-light mx-1" href="/empleados">Empleado</a></li>
            <li class="nav-item"><a class="btn btn-outline-light mx-1" href="/clientes">Clientes</a></li>
            <li class="nav-item"><a class="btn btn-outline-light mx-1" href="/ventas">Nueva Venta</a></li>
        </ul>
        <div class="dropdown">
            <button class="btn btn-outline-light dropdown-toggle" type="button" data-toggle="dropdown">
                {{ usuario.nombre or usuario.user }}
            </button>
            <div class="dropdown-menu dropdown-menu-right text-center">
                <span class="dropdown-item-text">{{ usuario.user }}</span>
                <span class="dropdown-item-text">{{ usuario.telefono or "" }}</span>
                <div class="dropdown-divider"></div>
                <form action="/logout" method="post">
                    <button class="dropdown-item" type="submit">Salir</button>
                </form>
            </div>
        </div>
    </div>
</nav>
{% endif %}
<main class="{% if usuario %}container-fluid py-4{% else %}container py-4{% endif %}">
    {% if mensaje %}
    <div class="alert alert-info alert-dismissible fade show" role="alert">
        {{ mensaje }}
        <button type="button" class="close" data-dismiss="alert" aria-label="Cerrar">
            <span aria-hidden="true">&times;</span>
        </button>
    </div>
    {% endif %}
    {% block content %}{% endblock %}
</main>
<script src="{{ url_for('static', path='bootstrap/jquery-3.3.1.slim.min.js') }}"></script>
<script src="{{ url_for('static', path='bootstrap/popper.min.js') }}"></script>
<script src="{{ url_for('static', path='bootstrap/bootstrap.min.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
