{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sistema de Ventas Web</title>
    <link rel="stylesheet" href="{% static 'bootstrap/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/estilos.css' %}">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-info">
        <a class="navbar-brand text-white" href="{% url 'inicio' %}">Home</a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Alternar navegación">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="btn btn-outline-light ml-2" href="{% url 'productos' %}" target="myFrame">Producto</a>
                </li>
                <li class="nav-item">
                    <a class="btn btn-outline-light ml-2" href="{% url 'empleados' %}" target="myFrame">Empleado</a>
                </li>
                <li class="nav-item">
                    <a class="btn btn-outline-light ml-2" href="{% url 'clientes' %}" target="myFrame">Clientes</a>
                </li>
                <li class="nav-item">
                    <a class="btn btn-outline-light ml-2" href="{% url 'registrar_venta' %}" target="myFrame">Nueva Venta</a>
                </li>
            </ul>
        </div>
        <div class="dropdown">
            <button class="btn btn-outline-light dropdown-toggle" type="button" id="dropdownMenuButton"
                    data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                {{ empleado.nombres }}
            </button>
            <div class="dropdown-menu dropdown-menu-right text-center" aria-labelledby="dropdownMenuButton">
                <a class="dropdown-item" href="#">
                    <img src="{% static 'img/no bitches.jpg' %}" height="60" width="60" alt="">
                </a>
                <span class="dropdown-item">{{ empleado.usuario }}</span>
                <span class="dropdown-item">{{ empleado.telefono }}</span>
                <div class="dropdown-divider"></div>
                <form action="{% url 'salir' %}" method="post">
                    {% csrf_token %}
                    <button class="dropdown-item" type="submit">Salir</button>
                </form>
            </div>
        </div>
    </nav>
    <main class="m-4" style="height: 550px;">
        <iframe name="myFrame" title="Contenido del sistema" style="height: 100%; width: 100%; border: none"></iframe>
    </main>
    <script src="{% static 'bootstrap/jquery-3.3.1.slim.min.js' %}"></script>
    <script src="{% static 'bootstrap/popper.min.js' %}"></script>
    <script src="{% static 'bootstrap/bootstrap.min.js' %}"></script>
</body>
</html>
