{% extends "base.html" %}
{% block title %}Login | Sistema de Ventas Web{% endblock %}
{% block content %}
<div class="row justify-content-center login-page">
    <div class="col-lg-4 col-md-6 col-sm-10">
        <div class="card shadow-sm">
            <div class="card-body">
                <form action="/login" method="post">
                    <div class="text-center mb-4">
                        <h3>Login</h3>
                        <img class="login-logo" src="{{ url_for('static', path='img/no-bitches.jpg') }}"
                             alt="Imagen de bienvenida">
                        <div>Bienvenido al Sistema</div>
                    </div>
                    <div class="form-group">
                        <label for="usuario">Usuario:</label>
                        <input class="form-control" id="usuario" name="usuario" type="text"
                               placeholder="Ingrese su Usuario" autocomplete="username" required>
                    </div>
                    <div class="form-group">
                        <label for="contrasena">Contraseña:</label>
                        <input class="form-control" id="contrasena" name="contrasena" type="password"
                               placeholder="Ingrese su Contraseña" autocomplete="current-password" required>
                        <small class="form-text text-muted">Ingresa el DNI registrado en la base de datos.</small>
                    </div>
                    <button class="btn btn-primary btn-block" type="submit">Ingresar</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
