{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sistema de Ventas Web</title>
    <link rel="stylesheet" href="{% static 'bootstrap/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/estilos.css' %}">
</head>
<body>
    <main class="container mt-4 col-lg-4">
        <div class="card col-sm-10">
            <div class="card-body">
                <form action="{% url 'login' %}" method="post">
                    {% csrf_token %}
                    <div class="form-group text-center">
                        <h3>Login</h3>
                        <img src="{% static 'img/no bitches.jpg' %}" height="70" width="170" alt="">
                        <label class="d-block">Bienvenido al Sistema</label>
                    </div>
                    {% if form.non_field_errors %}
                        <div class="alert alert-danger" role="alert">{{ form.non_field_errors }}</div>
                    {% endif %}
                    <div class="form-group">
                        <label for="{{ form.usuario.id_for_label }}">Usuario:</label>
                        {{ form.usuario }}
                        {{ form.usuario.errors }}
                    </div>
                    <div class="form-group">
                        <label for="{{ form.contrasena.id_for_label }}">Contraseña:</label>
                        {{ form.contrasena }}
                        {{ form.contrasena.errors }}
                    </div>
                    <button class="btn btn-primary btn-block" type="submit">Ingresar</button>
                </form>
            </div>
        </div>
    </main>
</body>
</html>
